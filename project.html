<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project | Andreina's Portfolio</title>

    <link rel="icon" href="assets/hero/icon.ico">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="js/projects-data.js" defer></script>
    <script src="js/script.js" defer></script>
</head>

<body>
    <header>
        <a href="index.html" class="logo">Andreina Lopes</a>

        <div class="menu-toggle" id="menu-toggle">
            <i class="fas fa-bars"></i>
        </div>

        <nav id="navbar">
            <ul>
                <li><a href="index.html#about" id="nav-about">About</a></li>
                <li><a href="index.html#projects" id="nav-projects">Projects</a></li>
                <li><a href="index.html#contact" id="nav-contact">Contact</a></li>
            </ul>
        </nav>

        <div class="lang-switch">
            <img src="assets/flags/flag-en.png" alt="English" data-lang="en">
            <img src="assets/flags/flag-es.png" alt="Español" data-lang="es">
            <img src="assets/flags/flag-pt.png" alt="Português" data-lang="pt">
        </div>
    </header>

    <section class="project-hero">
        <div class="project-hero-overlay">
            <a href="index.html#projects" class="back-link">
                <i class="fas fa-arrow-left"></i>
                <span id="back-to-projects">Back to projects</span>
            </a>

            <div class="project-hero-content">
                <span class="project-category" id="project-category">Category</span>
                <h1 id="project-title">Project title</h1>
                <p id="project-desc">Project description</p>

                <div class="project-meta-inline">
                    <span><i class="fas fa-calendar-alt"></i> <span id="year-value"></span></span>
                    <span><i class="fas fa-location-dot"></i> <span id="location-value"></span></span>
                </div>
            </div>
        </div>
    </section>

    <section class="project-layout">
        <div class="project-main">
            <div class="project-gallery-header">
                <h2 id="gallery-title">Gallery</h2>
                <p id="gallery-subtitle">Click an image to enlarge.</p>
            </div>

            <div class="gallery" id="gallery"></div>
        </div>

        <aside class="project-sidebar glass-card">
            <h3 id="details-title">Project details</h3>

            <ul class="project-info-list">
                <li>
                    <strong id="year-label">Year:</strong>
                    <span id="year-value-side"></span>
                </li>
                <li>
                    <strong id="location-label">Location:</strong>
                    <span id="location-value-side"></span>
                </li>
                <li>
                    <strong id="area-label">Built area:</strong>
                    <span id="area-value"></span>
                </li>
                <li>
                    <strong id="software-label">Software:</strong>
                    <span id="software-value"></span>
                </li>
            </ul>
        </aside>
    </section>

    <section class="next-project-section">
        <div class="next-project-card glass-card" id="next-project-card">
            <span class="next-project-label" id="next-project-label">Next Project</span>
            <a href="#" id="next-project-link" class="next-project-link">
                <span id="next-project-name">Project name</span>
                <i class="fas fa-arrow-right"></i>
            </a>
        </div>
    </section>

    <div id="lightbox" class="lightbox">
        <span class="close">&times;</span>
        <img class="lightbox-content" id="lightbox-img" alt="Expanded project image">
        <div class="lightbox-counter" id="lightbox-counter">1 / 1</div>
        <a class="prev">&#10094;</a>
        <a class="next">&#10095;</a>
    </div>

    <footer>
        <p>© 2025 Andreina – All Rights Reserved</p>
    </footer>

    <div id="dark-mode-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <i class="fas fa-moon"></i>
    </div>
</body>

</html>
